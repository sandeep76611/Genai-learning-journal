{% extends 'base.html' %}

{% block content %}
<h1>Welcome to My Dashboard</h1>

<div class="cards">
    {% for topic in topics %}
    <div class="card">
        <h3>{{ topic.title }}</h3>
        <p>{{ topic.description }}</p>
        <a href="{{ topic.link }}" class="btn-primary">Explore</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
